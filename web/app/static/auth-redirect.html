<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signing you in…</title>
</head>
<body style="background:#0e0f13;color:#f1f1f1;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Signing you in…</p>
  <script>
    // Supabase's magic-link redirect lands here with tokens in the URL
    // fragment (#access_token=...), which never reaches the Python server.
    // Convert it to a query string st.query_params can read.
    //
    // Locally this page is the top-level document. On Streamlit Community
    // Cloud it runs inside the Cloud wrapper's sandboxed iframe (served
    // under /~/+/), which can't navigate the top page and doesn't receive
    // the fragment -- but it is same-origin, so it can read the top URL's
    // fragment and navigate its own frame.
    var hash = window.location.hash;
    var isFramed = window.top !== window;
    if ((!hash || hash.length <= 1) && isFramed) {
      try { hash = window.top.location.hash; } catch (e) {}
    }

    var staticSuffix = /app\/static\/auth-redirect\.html$/;
    var appRoot = window.location.pathname.replace(staticSuffix, "");

    // Keep the tokens out of the visible address bar / history.
    if (isFramed) {
      try {
        window.top.history.replaceState(null, "", window.top.location.pathname.replace(staticSuffix, ""));
      } catch (e) {}
    }

    var target = appRoot;
    if (hash && hash.length > 1) {
      target += "?" + hash.substring(1);
    }
    window.location.replace(target);
  </script>
</body>
</html>
